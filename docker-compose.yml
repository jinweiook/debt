services:
  mysql:
    image: mysql:8.0
    container_name: debt-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dev123
      MYSQL_DATABASE: debt
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - debt-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdev123"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  debt-mysql-data:
